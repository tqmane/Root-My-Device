name: build-nothing-apk

on:
  push:
    branches: [main]
    paths:
      - 'devices/nothing-phone-3a/**'
      - '.github/workflows/build-nothing-apk.yml'
  pull_request:
    paths:
      - 'devices/nothing-phone-3a/**'
      - '.github/workflows/build-nothing-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nothing-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Nothing Phone (3a) APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Install Android build dependencies
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Test and build APK
        working-directory: devices/nothing-phone-3a
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: root-my-nothing-debug-${{ github.sha }}
          path: devices/nothing-phone-3a/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
